<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABHISHEK ENTERPRISES — Dropship Control Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased flex h-screen overflow-hidden">

  <!-- LEFT SIDEBAR -->
  <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between shrink-0">
    <div>
      <!-- Brand Header -->
      <div class="p-5 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">
            AE
          </div>
          <div>
            <h1 class="text-sm font-bold tracking-tight text-white leading-none">ABHISHEK ENTERPRISES</h1>
            <span class="text-[10px] text-emerald-400 font-medium">● Dropship Ops v2.4</span>
          </div>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="p-3 space-y-1 text-xs font-medium">
        <p class="px-3 py-2 text-[10px] uppercase tracking-wider text-slate-500 font-bold">Core Business</p>
        
        <button onclick="setTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-600 text-white transition">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Dashboard & Analytics</span>
        </button>

        <button onclick="setTab('orders')" id="nav-orders" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800/80 hover:text-white transition">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          <span>Orders & Forwarding</span>
          <span class="ml-auto bg-amber-500/20 text-amber-300 text-[10px] px-1.5 py-0.5 rounded font-bold" id="badge-pending-orders">3 New</span>
        </button>

        <button onclick="setTab('products')" id="nav-products" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800/80 hover:text-white transition">
          <i data-lucide="package" class="w-4 h-4"></i>
          <span>Products & Pricing Rules</span>
        </button>

        <p class="px-3 pt-4 pb-2 text-[10px] uppercase tracking-wider text-slate-500 font-bold">Dropship Logistics</p>

        <button onclick="setTab('suppliers')" id="nav-suppliers" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800/80 hover:text-white transition">
          <i data-lucide="factory" class="w-4 h-4"></i>
          <span>Suppliers & Catalogs</span>
        </button>

        <button onclick="setTab('shipping')" id="nav-shipping" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800/80 hover:text-white transition">
          <i data-lucide="truck" class="w-4 h-4"></i>
          <span>Shiprocket & AWB Sync</span>
        </button>

        <button onclick="setTab('cod')" id="nav-cod" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800/80 hover:text-white transition">
          <i data-lucide="banknote" class="w-4 h-4"></i>
          <span>COD Reconciliation</span>
        </button>

        <button onclick="setTab('calculator')" id="nav-calculator" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-400 hover:bg-slate-800/80 hover:text-white transition">
          <i data-lucide="calculator" class="w-4 h-4"></i>
          <span>Profit & RTO Calculator</span>
        </button>
      </nav>
    </div>

    <!-- User Status Footer -->
    <div class="p-3 border-t border-slate-800 bg-slate-900/50">
      <div class="flex items-center gap-3 p-2 rounded-lg bg-slate-800/50">
        <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center font-bold text-slate-300 text-xs">AT</div>
        <div class="overflow-hidden">
          <p class="text-xs font-bold text-slate-200 truncate">Abhishek Tiwari</p>
          <p class="text-[10px] text-slate-400">Store Owner</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN VIEWPORT -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    
    <!-- Top Action Bar -->
    <header class="h-14 border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="text-xs font-semibold uppercase text-slate-40
