<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizBoost Local - Amazon Style Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
        body { background-color: #e3e6e6; color: #0f1111; }

        /* Amazon Dark Header */
        header { background-color: #131921; color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; position: sticky; top: 0; z-index: 100; }
        
        .logo-container { display: flex; flex-direction: column; cursor: pointer; border: 1px solid transparent; padding: 4px 8px; border-radius: 2px; }
        .logo-container:hover { border-color: white; }
        .logo-container h1 { font-size: 22px; font-weight: bold; color: white; line-height: 1; }
        .logo-container span { font-size: 11px; color: #ff9900; font-weight: bold; margin-top: 2px; }

        /* Deliver To Box */
        .deliver-to { display: flex; align-items: center; gap: 5px; cursor: pointer; border: 1px solid transparent; padding: 4px 8px; border-radius: 2px; }
        .deliver-to:hover { border-color: white; }
        .deliver-text { display: flex; flex-direction: column; font-size: 12px; color: #ccc; }
        .deliver-text strong { color: white; font-size: 14px; }

        /* Search Bar */
        .search-container { display: flex; flex-grow: 1; max-width: 700px; height: 40px; }
        .search-category { background-color: #f3f3f3; border: none; border-radius: 4px 0 0 4px; padding: 0 10px; font-size: 12px; color: #555; cursor: pointer; border-right: 1px solid #cdcdcd; }
        .search-input { width: 100%; border: none; padding: 0 12px; font-size: 15px; outline: none; }
        .search-btn { background-color: #febd69; border: none; padding: 0 16px; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 18px; }
        .search-btn:hover { background-color: #f3a847; }

        /* Header Right Actions */
        .header-nav { display: flex; align-items: center; gap: 15px; }
        .nav-item { display: flex; flex-direction: column; font-size: 12px; color: white; cursor: pointer; border: 1px solid transparent; padding: 4px 8px; border-radius: 2px; }
        .nav-item:hover { border-color: white; }
        .nav-item strong { font-size: 14px; font-weight: bold; }

        .cart-btn { display: flex; align-items: center; color: white; text-decoration: none; font-weight: bold; cursor: pointer; position: relative; border: 1px solid transparent; padding: 4px 8px; border-radius: 2px; }
        .cart-btn:hover { border-color: white; }
        .cart-count { color: #f08804; font-size: 16px; font-weight: bold; margin-left: 4px; }

        /* Amazon Sub Navigation Bar */
        .sub-nav { background-color: #232f3e; color: white; display: flex; align-items: center; gap: 15px; padding: 8px 20px; font-size: 14px; overflow-x: auto; white-space: nowrap; }
        .sub-nav-item { cursor: pointer; padding: 4px 8px; border: 1px solid transparent; border-radius: 2px; }
        .sub-nav-item:hover { border-color: white; }
        .sub-nav-item.bold { font-weight: bold; }

        /* Main Container */
        .main-container { max-width: 1500px; margin: 0 auto; padding: 15px; }

        /* Banner */
        .banner { background: linear-gradient(to bottom, #232f3e, #e3e6e6); padding: 30px 20px; border-radius: 4px; margin-bottom: 20px; color: white; text-align: center; }
        .banner h2 { font-size: 26px; color: #febd69; margin-bottom: 5px; }

        /* Grid Layout */
        .products-section-title { font-size: 20px; font-weight: bold; margin-bottom: 15px; background: white; padding: 15px; border-radius: 4px 4px 0 0; border-bottom: 1px solid #ddd; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; background: white; padding: 20px; border-radius: 0 0 4px 4px; margin-bottom: 20px; }
        
        /* Product Card */
        .product-card { border: 1px solid #e7e7e7; padding: 15px; border-radius: 4px; background: white; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 180px; object-fit: contain; margin-bottom: 10px; }
        .product-title { font-size: 14px; line-height: 1.3; height: 38px; overflow: hidden; margin-bottom: 8px; font-weight: 500; }
        .rating { color: #ffa41c; font-size: 13px; margin-bottom: 5px; }
        .price-box { margin-bottom: 10px; }
        .currency { font-size: 12px; vertical-align: super; }
        .price { font-size: 20px; font-weight: bold; color: #0f1111; }
        .mrp { font-size: 12px; color: #565959; text-decoration: line-through; margin-left: 5px; }
        .prime-badge { color: #00a8e1; font-size: 12px; font-weight: bold; font-style: italic; margin-bottom: 8px; }
        .add-to-cart-btn { background-color: #ffd814; border: 1px solid #fcd200; border-radius: 20px; padding: 8px 12px; font-size: 13px; cursor: pointer; width: 100%; font-weight: 500; }
        .add-to-cart-btn:hover { background-color: #f7ca00; }

        /* Cart Side Drawer */
        .cart-drawer { position: fixed; top: 0; right: -420px; width: 380px; height: 100%; background: white; box-shadow: -2px 0 10px rgba(0,0,0,0.2); transition: 0.3s; z-index: 200; padding: 20px; display: flex; flex-direction: column; }
        .cart-drawer.open { right: 0; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; padding-bottom: 12px; }
        .cart-items { flex-grow: 1; overflow-y: auto; margin: 15px 0; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .checkout-btn { background-color: #ffd814; border: 1px solid #fcd200; border-radius: 20px; padding: 12px; width: 100%; font-size: 15px; font-weight: bold; cursor: pointer; }

        @media (max-width: 900px) {
            .deliver-to, .search-category { display: none; }
            header { padding: 10px; }
        }
    </style>
</head>

        <div class="logo-container">
            <h1>BizBoost</h1>
            <span>BY JMD Group</span>
        </div>

            <div class="deliver-text">
                <span>Deliver to Local</span>

                <option value="Sports & Fitness">Sports & Fitness</option>
            </select>
            <input type="text" class="search-input" id="searchInput" onkeyup="filterProducts()" placeholder="Search BizBoost Amazon Store...">
            <button class="search-btn">🔍</button>
